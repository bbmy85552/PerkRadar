name: Live sources

# Deliberately NOT part of PR checks. Upstream outages, anti-bot challenges and
# feed redesigns must not make unrelated pull requests fail.
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC; 04:23 UTC = 12:23 Beijing time.
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perkradar_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probe live sources into a throwaway database
        env:
          # `npm run report` writes to DATABASE_URL. This is an ephemeral
          # GitHub Actions Postgres service, not a production database.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/perkradar_probe
        run: npm run report
      - name: Upload probe summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-fetch-summary
          path: reports/live-fetch-summary.json
          if-no-files-found: warn
