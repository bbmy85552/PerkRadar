name: Secret scan

# Scan every reachable commit: a secret committed and later deleted is still exposed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC; 05:17 UTC = 13:17 Beijing time.
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # gitleaks-action derives its range from the push event's before/after
      # SHAs, which breaks after a force-push. Scan the whole reachable history
      # with a pinned, checksum-verified CLI instead.
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks version
      - name: Scan all reachable commits
        run: ./gitleaks detect --source . --no-banner --redact --exit-code 1
